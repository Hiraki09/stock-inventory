<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product - Component Inventory Tracker</title>
<!-- ================= WEBSITE & MOBILE ICONS (FAVICON) ================= -->
<link rel="icon" type="image/png" href="logo.png">
<link rel="shortcut icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<!-- เปิดโหมดเว็บแอปเต็มจอเมื่อกด Add to Home Screen บน iOS / iPad -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Component Tracker">

<!-- กำหนดรูปไอคอนขนาดใหญ่ขึ้น (แนะนำ 180x180 หรือ 512x512 พิกเซล เพื่อความคมชัดบนหน้าจอไอแพด) -->
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/add.css">
</head>

<body>

<script src="js/layout.js" data-page="add"></script>

<div class="main">
    <div class="header">
        <div class="title-area">
            <button class="menu-button" onclick="toggleSidebar()" title="Show/Hide Menu">☰</button>
            <div class="title">
                <h2>ADD PRODUCT</h2>
                <p>Add new equipment component to inventory system</p>
            </div>
        </div>
    </div>

    <div class="form-box">
        <h3>Equipment Details</h3>

        <form id="addEquipmentForm" onsubmit="saveProduct(event)">
            <div class="form-grid">

                <div class="form-group">
                    <label>PRODUCT ID (AUTO GENERATED)</label>
                    <input id="productId" class="form-control form-control-readonly" placeholder="AUTO GENERATED..." type="text" readonly/>
                </div>

                <div class="form-group">
                    <label>TYPE</label>
                    <select id="type" class="form-control" onchange="onTypeChange()" required>
                        <option value="">Select Type...</option>
                        <option value="LED">LED</option>
                        <option value="Transistor">Transistor</option>
                        <option value="Resistor">Resistor</option>
                        <option value="Capacitor">Capacitor</option>
                        <option value="IC">IC</option>
                        <option value="Inductor">Inductor</option>
                        <option value="Diode">Diode</option>
                        <option value="Module">Module</option>
                    </select>
                </div>

                <!-- ช่อง FOOTPRINT จะถูกเปลี่ยนเป็น Dropdown อัตโนมัติเมื่อเลือก Type -->
                <div class="form-group" id="footprintContainer">
                    <label>FOOTPRINT</label>
                    <select id="footprint" class="form-control" disabled required>
                        <option value="">Please select Type first...</option>
                    </select>
                </div>

                <!-- ช่อง DEVICE TYPE / DETAIL ถูกเปลี่ยนเป็น Dropdown (เลขรหัส) ตาม Type -->
                <div class="form-group" id="deviceTypeContainer">
                    <label>DEVICE TYPE / DETAIL</label>
                    <select id="deviceType" class="form-control" disabled required onchange="generateProductID()">
                        <option value="">Please select Type first...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>EQUIPMENT COST / SPEC</label>
                    <input id="cost" class="form-control" placeholder="e.g. 10 kΩ, 4.7v" type="text" oninput="generateProductID()" required/>
                </div>

                <div class="form-group">
                    <label>DURABILITY / VOLTAGE</label>
                    <input id="durability" class="form-control" placeholder="e.g. +-0.25W, 40V / 200mA" type="text" oninput="generateProductID()" required/>
                </div>

                <!-- เพิ่มฟิลด์เลือกตำแหน่งตู้ลิ้นชัก (Drawer Location) -->
                <div class="form-group">
                    <label>DRAWER LOCATION (ตำแหน่งตู้)</label>
                    <select id="location" class="form-control" required>
                        <option value="-">-</option>
                        <option value="R11">R11</option>
                        <option value="R12">R12</option>
                        <option value="R13">R13</option>
                        <option value="R21">R21</option>
                        <option value="R22">R22</option>
                        <option value="R23">R23</option>
                        <option value="R31">R31</option>
                        <option value="R32">R32</option>
                        <option value="R33">R33</option>
                        <option value="R41">R41</option>
                        <option value="R42">R42</option>
                        <option value="R43">R43</option>
                        <option value="R51">R51</option>
                        <option value="R52">R52</option>
                        <option value="R53">R53</option>
                        <option value="R61">R61</option>
                        <option value="R62">R62</option>
                        <option value="R63">R63</option>
                        <option value="R71">R71</option>
                        <option value="R72">R72</option>
                        <option value="R73">R73</option>
                        <option value="R81">R81</option>
                        <option value="R82">R82</option>
                        <option value="R83">R83</option>
                        <option value="R9L1">R9L1</option>
                        <option value="R9L2">R9L2</option>
                        <option value="R9L3">R9L3</option>
                        <option value="R10L1">R10L1</option>
                        <option value="R10L2">R10L2</option>
                        <option value="R10L3">R10L3</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>QUANTITY</label>
                    <input id="quantity" class="form-control" placeholder="0" type="number" min="1" required/>
                </div>

            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="window.location.href='main.HTML'">Cancel</button>
                <button type="submit" class="btn btn-primary">SAVE ITEM</button>
            </div>
        </form>
    </div>
</div>

<script src="js/add.js"></script>

<script src="js/i18n.js"></script>
</body>
</html>
