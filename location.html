<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cabinet Visualizer - Component Inventory Tracker</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="shortcut icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Component Tracker">

<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/location.css">
</head>

<body>

<script src="js/layout.js" data-page="location"></script>

<div class="main">
    <div class="header">
        <div class="title-area">
            <button class="menu-button" onclick="toggleSidebar()">☰</button>
            <div class="title">
                <h2>Location Finder</h2>
                <p>Interactive cabinet drawer visualizer</p>
            </div>
        </div>
    </div>

    <div class="content-layout">
        <div class="panel">
            <div class="search-bar-wrapper">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search Product ID, Type..." onkeyup="filterItems()">
                <button class="reset-filter-btn" onclick="resetDrawerFilter()" title="Show All">RESET</button>
            </div>
            <div class="item-list" id="itemList">
                <div style="color: #64748b; text-align: center; padding: 20px;">Loading from Database...</div>
            </div>
        </div>

        <div class="cabinet-container">
            <div class="cabinet-frame">
                <div class="drawer-row"><div class="drawer" data-drawer="R11" onclick="filterByDrawer('R11')">R11</div><div class="drawer" data-drawer="R12" onclick="filterByDrawer('R12')">R12</div><div class="drawer" data-drawer="R13" onclick="filterByDrawer('R13')">R13</div></div>
                <div class="drawer-row"><div class="drawer" data-drawer="R21" onclick="filterByDrawer('R21')">R21</div><div class="drawer" data-drawer="R22" onclick="filterByDrawer('R22')">R22</div><div class="drawer" data-drawer="R23" onclick="filterByDrawer('R23')">R23</div></div>
                <div class="drawer-row"><div class="drawer" data-drawer="R31" onclick="filterByDrawer('R31')">R31</div><div class="drawer" data-drawer="R32" onclick="filterByDrawer('R32')">R32</div><div class="drawer" data-drawer="R33" onclick="filterByDrawer('R33')">R33</div></div>
                <div class="drawer-row"><div class="drawer" data-drawer="R41" onclick="filterByDrawer('R41')">R41</div><div class="drawer" data-drawer="R42" onclick="filterByDrawer('R42')">R42</div><div class="drawer" data-drawer="R43" onclick="filterByDrawer('R43')">R43</div></div>
                <div class="drawer-row"><div class="drawer" data-drawer="R51" onclick="filterByDrawer('R51')">R51</div><div class="drawer" data-drawer="R52" onclick="filterByDrawer('R52')">R52</div><div class="drawer" data-drawer="R53" onclick="filterByDrawer('R53')">R53</div></div>
                <div class="drawer-row"><div class="drawer" data-drawer="R61" onclick="filterByDrawer('R61')">R61</div><div class="drawer" data-drawer="R62" onclick="filterByDrawer('R62')">R62</div><div class="drawer" data-drawer="R63" onclick="filterByDrawer('R63')">R63</div></div>
                <div class="drawer-row"><div class="drawer" data-drawer="R71" onclick="filterByDrawer('R71')">R71</div><div class="drawer" data-drawer="R72" onclick="filterByDrawer('R72')">R72</div><div class="drawer" data-drawer="R73" onclick="filterByDrawer('R73')">R73</div></div>
                <div class="drawer-row"><div class="drawer" data-drawer="R81" onclick="filterByDrawer('R81')">R81</div><div class="drawer" data-drawer="R82" onclick="filterByDrawer('R82')">R82</div><div class="drawer" data-drawer="R83" onclick="filterByDrawer('R83')">R83</div></div>
                <div class="drawer-row">
                    <div class="drawer large" data-drawer="R9L1" onclick="filterByDrawer('R9L1')">R9L1</div>
                    <div class="drawer large" data-drawer="R9L2" onclick="filterByDrawer('R9L2')">R9L2</div>
                    <div class="drawer large" data-drawer="R9L3" onclick="filterByDrawer('R9L3')">R9L3</div>
                </div>
                <div class="drawer-row">
                    <div class="drawer large" data-drawer="R10L1" onclick="filterByDrawer('R10L1')">R10L1</div>
                    <div class="drawer large" data-drawer="R10L2" onclick="filterByDrawer('R10L2')">R10L2</div>
                    <div class="drawer large" data-drawer="R10L3" onclick="filterByDrawer('R10L3')">R10L3</div>
                </div>
            </div>
            <div class="cabinet-status-text" id="statusText">Click a drawer to filter items or click an item to highlight</div>
        </div>
    </div>
</div>

<script src="js/location.js"></script>

<script src="js/i18n.js"></script>
</body> 
</html>
