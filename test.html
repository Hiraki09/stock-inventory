<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sidebar Component</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
}

body {
    background: #080f1b;
    color: #e5e7eb;
    min-height: 100vh;
    display: flex;
}

body.light-mode {
    background: #f1f5f9;
    color: #1e293b;
}

/* ================= SIDEBAR ================= */

.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 265px;
    height: 100vh;
    overflow: hidden;
    background: #09111d;
    border-right: 1px solid #243244;
    padding: 28px 14px;
}

body.light-mode .sidebar {
    background: #ffffff;
    border-right: 1px solid #cbd5e1;
}

.logo {
    padding: 0 15px 28px;
    border-bottom: 1px solid #202d3d;
    margin-bottom: 25px;
}

body.light-mode .logo {
    border-bottom: 1px solid #e2e8f0;
}

.logo h1 {
    font-size: 27px;
    color: #f8fafc;
    letter-spacing: -1px;
}

body.light-mode .logo h1 {
    color: #0f172a;
}

.logo p {
    color: #aab4c3;
    font-size: 17px;
    letter-spacing: 1px;
}

body.light-mode .logo p {
    color: #64748b;
}

/* MENU */

.menu a {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px 18px;
    margin-bottom: 7px;
    border-radius: 9px;
    color: #aeb9c9;
    text-decoration: none;
    font-size: 16px;
    transition: 0.2s;
}

body.light-mode .menu a {
    color: #475569;
}

.menu a:hover {
    background: #141e2c;
    color: white;
}

body.light-mode .menu a:hover {
    background: #f1f5f9;
    color: #0f172a;
}

.menu a.active {
    background: #162235;
    color: #70a0ff;
    border: 1px solid #263752;
}

body.light-mode .menu a.active {
    background: #eff6ff;
    color: #2563eb;
    border: 1px solid #bfdbfe;
}

.icon {
    width: 23px;
    text-align: center;
    font-size: 19px;
}

/* USER PROFILE BOX */

.user {
    position: absolute;
    bottom: 20px;
    left: 14px;
    width: 237px;
    padding: 15px;
    background: #101a28;
    border: 1px solid #263448;
    border-radius: 9px;
}

body.light-mode .user {
    background: #f8fafc;
    border: 1px solid #cbd5e1;
}

.user-name {
    font-weight: bold;
}

.user-email {
    color: #8995a7;
    font-size: 12px;
    margin-top: 4px;
}

body.light-mode .user-email {
    color: #64748b;
}
</style>
</head>

<body>

<div class="sidebar">
    <div class="logo">
        <h1>COMPONENT</h1>
        <p>INVENTORY TRACKER</p>
    </div>

    <div class="menu">
        <a href="main.HTML">
            <span class="icon">▦</span>
            Dashboard
        </a>
        <a href="Inventory.html">
            <span class="icon">◇</span>
            Inventory
        </a>
        <a href="ADD.html">
            <span class="icon">▥</span>
            Add Product
        </a>
        <a href="history.html">
            <span class="icon">▤</span>
            History
        </a>
        <a href="setting.html">
            <span class="icon">⚙</span>
            Settings
        </a>
    </div>

    <div class="user">
        <div class="user-name" id="currentUserName">● &nbsp; Loading...</div>
        <div class="user-email" id="currentUserEmail">Loading...</div>
    </div>
</div>

<script>
/* =====================================================
   LOAD THEME FROM SETTINGS
===================================================== */
const savedTheme = localStorage.getItem('appTheme') || 'dark';
if (savedTheme === 'light') {
    document.body.classList.add('light-mode');
}

/* =====================================================
   CHECK LOGIN
===================================================== */
const loggedInUser = localStorage.getItem("loggedInUser");

if (!loggedInUser) {
    window.location.href = "Login.HTML";
}

/* =====================================================
   แสดง ID + E-MAIL ของคนที่ Login
===================================================== */
let currentUsername = "Unknown";
try {
    const currentUser = JSON.parse(loggedInUser);
    currentUsername = currentUser.id || currentUser.email || "Unknown";

    document.getElementById("currentUserName").innerHTML =
        "● &nbsp;" + escapeHtml(currentUsername);

    document.getElementById("currentUserEmail").textContent =
        currentUser.email || "";

} catch (error) {
    console.error("Invalid login data:", error);
    localStorage.removeItem("loggedInUser");
    window.location.href = "Login.HTML";
}

/* ================= HTML ESCAPE HELPER ================= */
function escapeHtml(text) {
    if (!text) return "";
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
</script>

</body>
</html>
