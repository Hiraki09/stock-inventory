<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory - Component Inventory Tracker</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="shortcut icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<!-- Enable full-screen web app mode when "Add to Home Screen" is used on iOS / iPad -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Component Tracker">

<!-- Set a larger icon (180x180 or 512x512 px recommended for sharpness on iPad) -->
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/inventory.css">
</head>

<body>

<script src="js/layout.js" data-page="inventory"></script>

<!-- ================= MAIN ================= -->
<div class="main">

    <!-- ================= HEADER ================= -->
    <div class="header">
        <div class="title-area">
            <button
                class="menu-button"
                onclick="toggleSidebar()"
                title="Show/Hide Menu"
            >
                ☰
            </button>
            <div class="title">
                <h2>Inventory</h2>
                <p>All components in stock</p>
            </div>
        </div>

        <div class="header-actions">
            <button
                class="add-btn"
                onclick="addItem()"
            >
                ＋ ADD Product
            </button>
            <button
                class="refresh-btn"
                onclick="refreshPage()"
                title="Refresh the page"
            >
                ⟳ Refresh
            </button>
        </div>
    </div>

    <!-- ================= INVENTORY BOX ================= -->
    <div class="inventory-box">

        <!-- ================= SEARCH ================= -->
        <div class="search-area">
            <input
                type="text"
                id="search"
                class="search"
                placeholder="⌕ Search by Product ID, Equipment Cost, Type..."
                onkeyup="searchInventory()"
            >
        </div>

        <!-- ================= TABLE ================= -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>PRODUCT ID</th>
                        <th>
                            <select id="typeFilter" class="type-filter" onchange="searchInventory()">
                                <option value="">TYPE (ALL)</option>
                                <option value="LED">LED</option>
                                <option value="Transistor">Transistor</option>
                                <option value="Resistor">Resistor</option>
                                <option value="Capacitor">Capacitor</option>
                                <option value="IC">IC</option>
                                <option value="Inductor">Inductor</option>
                                <option value="Diode">Diode</option>
                                <option value="Module">Module</option>
                            </select>
                        </th>
                        <th>FOOTPRINT</th>
                        <th>DEVICE TYPE</th>
                        <th>EQUIPMENT COST</th>
                        <th>DURABILITY</th>
                        <th>QUANTITY</th>
                        <th>LOCATION</th>
                        <th>DATE</th>
                        <th>ACTIONS</th>
                    </tr>
                </thead>
                <tbody id="inventoryTable"></tbody>
            </table>
        </div>

        <!-- ================= BOTTOM ================= -->
        <div class="bottom">
            <div
                class="showing"
                id="showingCount"
            >
                Showing 0 items
            </div>
            
            <div style="display: flex; align-items: center; gap: 10px;">
                <label for="rowsPerPageSelect" style="font-size: 14px; color: inherit;">Rows per page:</label>
                <select id="rowsPerPageSelect" class="form-control" style="width: 80px; height: 35px; padding: 0 10px;" onchange="changeRowsPerPage()">
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                </select>
            </div>

            <div
                class="pagination"
                id="paginationControls"
            ></div>
        </div>

    </div>

</div>

<!-- ================= EDIT MODAL ================= -->
<div class="modal-overlay" id="editModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Equipment Details</h3>
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label>PRODUCT ID (AUTO GENERATED)</label>
                <input type="text" id="editId" class="form-control" readonly style="opacity: 0.7; cursor: not-allowed;">
            </div>
            <div class="form-group">
                <label>TYPE</label>
                <select id="editType" class="form-control" onchange="updateTypeDropdowns()">
                    <option value="">Select Type...</option>
                    <option value="LED">LED</option>
                    <option value="Transistor">Transistor</option>
                    <option value="Resistor">Resistor</option>
                    <option value="Capacitor">Capacitor</option>
                    <option value="IC">IC</option>
                    <option value="Inductor">Inductor</option>
                    <option value="Diode">Diode</option>
                    <option value="Module">Module</option>
                </select>
            </div>
            <div class="form-group">
                <label>FOOTPRINT</label>
                <select id="editFootprint" class="form-control" onchange="generateProductId()">
                    <option value="">Select Footprint...</option>
                </select>
            </div>
            <div class="form-group">
                <label>DEVICE TYPE / DETAIL</label>
                <select id="editDeviceType" class="form-control" onchange="generateProductId()">
                    <option value="">Select Device Type...</option>
                </select>
            </div>
            <div class="form-group">
                <label>EQUIPMENT COST / SPEC</label>
                <input type="text" id="editCostSpec" class="form-control" placeholder="e.g. 10 kΩ, 4.7v" oninput="generateProductId()">
            </div>
            <div class="form-group">
                <label>DURABILITY / VOLTAGE</label>
                <input type="text" id="editDurability" class="form-control" placeholder="e.g. +-0.25W, 40V / 200mA" oninput="generateProductId()">
            </div>
            <div class="form-group">
                <label>QUANTITY</label>
                <input type="number" id="editQuantity" class="form-control" placeholder="0">
            </div>
            <div class="form-group">
                <label>LOCATION / DRAWER</label>
                <select id="editLocation" class="form-control">
                    <option value="-">-</option>
                    <option value="R11">R11</option>
                    <option value="R12">R12</option>
                    <option value="R13">R13</option>
                    <option value="R21">R21</option>
                    <option value="R22">R22</option>
                    <option value="R23">R23</option>
                    <option value="R31">R31</option>
                    <option value="R32">R32</option>
                    <option value="R33">R33</option>
                    <option value="R41">R41</option>
                    <option value="R42">R42</option>
                    <option value="R43">R43</option>
                    <option value="R51">R51</option>
                    <option value="R52">R52</option>
                    <option value="R53">R53</option>
                    <option value="R61">R61</option>
                    <option value="R62">R62</option>
                    <option value="R63">R63</option>
                    <option value="R71">R71</option>
                    <option value="R72">R72</option>
                    <option value="R73">R73</option>
                    <option value="R81">R81</option>
                    <option value="R82">R82</option>
                    <option value="R83">R83</option>
                    <option value="R9L1">R9L1</option>
                    <option value="R9L2">R9L2</option>
                    <option value="R9L3">R9L3</option>
                    <option value="R10L1">R10L1</option>
                    <option value="R10L2">R10L2</option>
                    <option value="R10L3">R10L3</option>
                </select>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
            <button class="btn-save" onclick="saveEditedItem()">SAVE ITEM</button>
        </div>
    </div>
</div>

<!-- ================= DELETE PASSWORD MODAL ================= -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal-content delete-modal-content">
        <div class="modal-header">
            <h3>Confirm Deletion</h3>
        </div>
        <p id="deleteModalText">Please enter your password to confirm deleting this item:</p>
        <div class="form-group full-width" style="margin-bottom: 15px;">
            <input type="password" id="deletePasscodeInput" class="form-control" placeholder="Enter Delete Passcode" style="text-align: center;">
        </div>
        <div class="modal-actions" style="justify-content: center;">
            <button class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
            <button class="btn-delete-confirm" onclick="confirmDeleteItem()">Delete</button>
        </div>
    </div>
</div>

<script src="js/inventory.js"></script>

<script src="js/i18n.js"></script>
</body>
</html>
