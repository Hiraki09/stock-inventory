<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - Component Inventory Tracker</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="shortcut icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Component Tracker">
<link rel="apple-touch-icon" href="logo.png">

<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/setting.css">
</head>

<body>

<script src="js/layout.js" data-page="setting"></script>

<!-- ================= MAIN ================= -->
<main class="main">
    <div class="header">
        <div class="title-area">
            <button class="menu-button" onclick="toggleSidebar()" title="Show/Hide Menu">☰</button>
            <div class="title">
                <h2>Settings</h2>
                <p>Manage application preferences</p>
            </div>
        </div>
    </div>

    <div class="settings-container">
        <!-- Appearance Settings -->
        <div class="setting-card">
            <h3>Appearance Theme</h3>
            <p>Choose between dark and light appearance modes for the interface.</p>
            <div class="theme-options">
                <button class="theme-btn" id="darkThemeBtn" onclick="setTheme('dark')">Dark Mode</button>
                <button class="theme-btn" id="lightThemeBtn" onclick="setTheme('light')">Light Mode</button>
            </div>
        </div>

        <!-- Mobile View Mode Settings -->
        <div class="setting-card">
            <div class="setting-item-row">
                <div>
                    <h3>Mobile View Mode</h3>
                    <p style="margin-bottom: 0;">Simulate a mobile device screen layout for the interface.</p>
                </div>
                <label class="switch">
                    <input type="checkbox" id="mobileModeToggle" onchange="toggleMobileMode()">
                    <span class="slider round"></span>
                </label>
            </div>
        </div>

        <!-- Account / Session Actions -->
        <div class="setting-card">
            <h3>Account Session</h3>
            <p>Sign out from your current session on this device.</p>
            <button class="btn-logout" onclick="logout()">Log Out</button>
        </div>
    </div>
</main>

<script src="js/setting.js"></script>
<script src="js/i18n.js"></script>
</body>
</html>
