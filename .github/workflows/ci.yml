name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          failed=0
          for f in server.js js/*.js; do
            [ -f "$f" ] || continue
            if node --check "$f"; then
              echo "✅ $f"
            else
              echo "::error file=$f::Syntax error in $f"
              failed=1
            fi
          done
          exit $failed
