<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - COMPONENT INVENTORY TRACKER</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="shortcut icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Component Tracker">
<link rel="stylesheet" href="css/login.css">
</head>

<body>

<div class="login-container">

    <div class="logo">
        <div class="logo-icon">
            <div class="logo-box"></div>
            <div class="logo-box"></div>
            <div class="logo-box"></div>
            <div class="logo-box"></div>
        </div>
        <div class="logo-text">
            <div class="logo-title">COMPONENT</div>
            <div class="logo-subtitle">INVENTORY</div>
            <div class="logo-subtitle">TRACKER</div>
        </div>
    </div>

    <div class="login-title">LOGIN</div>

    <form class="form" onsubmit="login(event)">

        <label for="email">E-MAIL</label>
        <div class="input-box">
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <label for="password">PASSWORD</label>
        <div class="input-box">
            <input type="password" id="password" placeholder="Enter your password" required>
            <button type="button" class="password-toggle" id="toggleButton" onclick="togglePassword()">👁</button>
        </div>

        <button type="submit" class="login-button">LOGIN</button>

        <div class="error" id="error">Invalid E-mail or Password</div>

    </form>

</div>

<script src="js/login.js"></script>

<script src="js/i18n.js"></script>
</body>
</html>
