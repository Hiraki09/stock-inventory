<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - COMPONENT INVENTORY TRACKER</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="shortcut icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Component Tracker">

<!-- โหลด Supabase JS Client SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body {
    min-height: 100vh;
    background: radial-gradient(circle at center, #18263d 0%, #0c1526 45%, #030817 100%);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.login-container {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
}

.logo {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 32px;
}

.logo-icon {
    width: 62px;
    height: 62px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-right: 14px;
}

.logo-box {
    border: 3px solid #00ff66;
    border-radius: 6px;
    box-shadow: 0 0 7px rgba(0,255,102,0.7), 0 0 14px rgba(0,255,102,0.25);
}

.logo-text {
    text-align: left;
}

.logo-title {
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.5px;
    color: #00ff66;
    text-shadow: 0 0 7px rgba(0,255,102,0.35);
}

.logo-subtitle {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: 0.5px;
    color: #f1f5f9;
}

.login-title {
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 4px;
    margin-bottom: 20px;
    color: #f8fafc;
}

.form {
    width: 100%;
}

label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 3px;
    color: #dce3ed;
    margin-bottom: 7px;
}

.input-box {
    position: relative;
    width: 100%;
    margin-bottom: 18px;
}

input {
    width: 100%;
    height: 48px;
    border: none;
    outline: none;
    border-radius: 25px;
    padding: 0 18px;
    background: #e8edf5;
    color: #111827;
    font-size: 14px;
    transition: 0.2s;
}

input::placeholder {
    color: #7b8798;
}

input:focus {
    box-shadow: 0 0 0 2px #00ff66, 0 0 12px rgba(0,255,102,0.25);
}

.password-toggle {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: #64748b;
    font-size: 18px;
    cursor: pointer;
}

.password-toggle:hover {
    color: #111827;
}

.login-button {
    width: 100%;
    height: 50px;
    margin-top: 5px;
    border-radius: 25px;
    border: 2px solid #00ff66;
    background: rgba(0,30,20,0.35);
    color: #00ff66;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 2px;
    cursor: pointer;
    transition: 0.25s;
    box-shadow: 0 0 8px rgba(0,255,102,0.2);
}

.login-button:hover {
    background: #00ff66;
    color: #06100b;
    box-shadow: 0 0 15px rgba(0,255,102,0.5);
    transform: translateY(-1px);
}

.login-button:active {
    transform: scale(0.98);
}

.error {
    display: none;
    margin-top: 12px;
    color: #ff6b6b;
    font-size: 13px;
    text-align: center;
}

@media (max-width: 500px) {
    .login-container {
        max-width: 360px;
        padding: 15px;
    }
    .logo-icon {
        width: 52px;
        height: 52px;
        gap: 5px;
        margin-right: 11px;
    }
    .logo-box {
        border-width: 2px;
    }
    .logo-title {
        font-size: 21px;
    }
    .logo-subtitle {
        font-size: 15px;
    }
    .login-title {
        font-size: 19px;
    }
    input {
        height: 45px;
    }
    .login-button {
        height: 47px;
    }
}
</style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        <div class="logo-icon">
            <div class="logo-box"></div>
            <div class="logo-box"></div>
            <div class="logo-box"></div>
            <div class="logo-box"></div>
        </div>
        <div class="logo-text">
            <div class="logo-title">COMPONENT</div>
            <div class="logo-subtitle">INVENTORY</div>
            <div class="logo-subtitle">TRACKER</div>
        </div>
    </div>

    <div class="login-title">LOGIN</div>

    <form class="form" onsubmit="login(event)">

        <label for="email">E-MAIL</label>
        <div class="input-box">
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <label for="password">PASSWORD</label>
        <div class="input-box">
            <input type="password" id="password" placeholder="Enter your password" required>
            <button type="button" class="password-toggle" id="toggleButton" onclick="togglePassword()">👁</button>
        </div>

        <button type="submit" class="login-button">LOGIN</button>

        <div class="error" id="error">Invalid E-mail or Password</div>

    </form>
</div>

<script>
/* =====================================================
    SUPABASE CONFIGURATION
===================================================== */
const SUPABASE_URL = 'https://yazfofbrbabjzbucwaqn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_H5qtYTLBfnFn0JyFqfad0Q_uK0beoNo';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);


/* =====================================================
    CHECK LOGIN
===================================================== */
const loggedInUser = localStorage.getItem("loggedInUser");
if (loggedInUser) {
    window.location.href = "main.HTML";
}


/* =====================================================
    SHOW / HIDE PASSWORD
===================================================== */
function togglePassword() {
    const password = document.getElementById("password");
    const button = document.getElementById("toggleButton");

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "🙈";
    } else {
        password.type = "password";
        button.textContent = "👁";
    }
}


/* =====================================================
    LOGIN FUNCTION
===================================================== */
async function login(event) {
    event.preventDefault();

    const inputEmail = document.getElementById("email").value.trim();
    const inputPassword = document.getElementById("password").value;
    const error = document.getElementById("error");

    try {
        const { data: users, error: fetchError } = await supabase
            .from('users')
            .select('*')
            .ilike('email', inputEmail);

        if (fetchError) {
            console.error('Error fetching users:', fetchError.message);
            error.style.display = "block";
            return;
        }

        const foundUser = users.find(user => user.password === inputPassword);

        if (foundUser) {
            const currentUser = {
                id: foundUser.id,
                email: foundUser.email
            };

            localStorage.setItem("loggedInUser", JSON.stringify(currentUser));
            error.style.display = "none";

            const { error: dbError } = await supabase
                .from('history')
                .insert([
                    {
                        action: 'LOGIN',
                        product_id: foundUser.email,
                        time: new Date().toLocaleString(),
                        user: foundUser.id
                    }
                ]);

            if (dbError) {
                console.error('Supabase history insert error:', dbError.message);
            }

            window.location.href = "main.HTML";
        } else {
            error.style.display = "block";
        }

    } catch (err) {
        console.error('Network or Supabase error:', err);
        error.style.display = "block";
    }
}
</script>

</body>
</html>
